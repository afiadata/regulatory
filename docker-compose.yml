services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regulatory
      POSTGRES_PASSWORD: regulatory
      POSTGRES_DB: regulatory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulatory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
