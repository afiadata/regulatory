# ---------------------------------------------------------------------------
# Category 10: Manufacturer in corpus, no active signals (1)
#
# Tests the "no news is real news" path: agent returns recall history with
# citations but does NOT fabricate active risk signals or refuse. Verifies
# the agent does not hallucinate concerns when a manufacturer's history is
# unremarkable relative to the repeat-violator threshold.
#
# Implementation note: verify 'Roche' (Roche Products / F. Hoffmann-La Roche)
# against the live corpus before running --live. It appears in SAHPRA data
# but likely below the repeat-violator threshold (3+ recalls, score ≥ 4) in
# the current 24-month window. If Roche does have active signals, substitute
# with a different manufacturer from the corpus with 0–2 mild recalls.
# ---------------------------------------------------------------------------

- id: q039
  category: manufacturer_no_signals
  user: "Tell me about Roche's recall history from the corpus."
  expected:
    must_cite: true
    must_refuse: false
    # Require a positive "no active signals" assertion; forbid only affirmative forms of
    # "repeat violator" so negation ("not flagged as a repeat violator") does not fail.
    must_contain_phrases:
      - "no active"
    must_not_contain_phrases:
      - "is a repeat violator"
      - "is flagged as a repeat violator"
      - "has been flagged as a repeat violator"
    must_include_caveat: null

