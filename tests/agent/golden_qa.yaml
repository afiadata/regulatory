# Golden QA evaluation set for the AfiaData Regulatory Agent.
# 40 question/expected-behaviour pairs across 11 categories.
#
# expected fields:
#   must_cite: bool       — response must include [doc:...] or [signal:...]
#   must_refuse: bool     — response must match one of the four refusal templates
#   must_contain_phrases: list[str]
#   must_not_contain_phrases: list[str]
#   must_include_caveat: null | "synthetic_data" | "count_inflation"
#
# Category taxonomy (use exactly these values in the 'category' field):
#   factual_recall           — corpus has the answer; agent must cite
#   manufacturer_profile     — full manufacturer profile from the corpus
#   county_exposure          — county supply mix; always needs synthetic_data caveat
#   refusal_medical          — medical advice refusal
#   refusal_legal            — legal advice refusal
#   refusal_out_of_scope     — off-topic refusal
#   refusal_out_of_corpus    — jurisdiction/source genuinely outside the corpus
#   caveat_surfacing         — questions designed to trigger mandatory caveats
#   corpus_limit             — corpus partially covers; agent answers available range
#                              and communicates the limit (NOT a refusal)
#   manufacturer_no_signals  — manufacturer in corpus but below repeat-violator threshold
#   manufacturer_disambiguation — name matches multiple canonical entries

