# Golden QA evaluation set for the AfiaData Regulatory Agent.
# 40 question/expected-behaviour pairs across 7 categories.
# Questions are representative starting points; flagged for lead review
# before running `regulatory agent eval run --live`.
#
# expected fields:
#   must_cite: bool       — response must include [doc:...] or [signal:...]
#   must_refuse: bool     — response must match one of the refusal templates
#   must_contain_phrases: list[str]
#   must_not_contain_phrases: list[str]
#   must_include_caveat: null | "synthetic_data" | "count_inflation"

# ---------------------------------------------------------------------------
# Category 1: Factual recall queries (8)
# ---------------------------------------------------------------------------

- id: q001
  category: factual_recall
  user: "How many amoxicillin recalls were there in 2025?"
