[project]
name = "regulatory"
version = "0.1.0"
description = "AfiaData Regulatory Monitor — multi-jurisdiction ingestion framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # HTTP
    "httpx>=0.27.0",
    # HTML parsing
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    # PDF extraction
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.5",
    # Pydantic schemas
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    # Database
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    # LLM
    "anthropic>=0.34.2",
    # CLI
    "typer>=0.12.3",
    # Logging
    "structlog>=24.4.0",
    # Config
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    # Utilities
    "tqdm>=4.67.1",
    # Modal (kept for batch PDF processing)
    "modal>=0.64.0",
    # Data
    "pandas>=2.3.3",
]

[project.scripts]
regulatory = "regulatory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulatory"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-recording>=0.13.2",
    "vcrpy>=6.0.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.1",
    "ruff>=0.5.5",
    "pre-commit>=3.8.0",
    "types-beautifulsoup4>=4.12.0",
    "types-pyyaml>=6.0.12",
    "sqlalchemy[mypy]>=2.0.31",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/regulatory --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/regulatory"]
omit = ["tests/*"]
